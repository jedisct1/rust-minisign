[package]
name = "minisign"
version = "0.10.0"
authors = [
    "Frank Denis <github@pureftpd.org>",
    "Daniel Rangel <daniel@rangel.in>",
]
description = "Minisign file signing and signature verification in pure Rust, with Ed25519 signatures and password-protected secret keys."
edition = "2018"
license = "MIT"
readme = "README.md"
categories = ["cryptography"]
keywords = ["minisign", "ed25519", "signatures", "file-signing", "verification"]
repository = "https://github.com/jedisct1/rust-minisign"
homepage = "https://github.com/jedisct1/rust-minisign"

[target.'cfg(all(any(target_arch = "wasm32", target_arch = "wasm64"), target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", optional = false, default-features = false, features = ["wasm_js"] }

[target.'cfg(not(all(any(target_arch = "wasm32", target_arch = "wasm64"), target_os = "unknown")))'.dependencies]
getrandom = { version = "0.4", optional = false, default-features = false }

[dependencies]
scrypt = { version = "0.11.0", default-features = false }
ct-codecs = "1.1.7"

[target.'cfg(any(windows, unix))'.dependencies]
rpassword = "7.5.4"

[profile.dev]
lto = "thin"
opt-level = 3

[profile.test]
lto = "thin"
opt-level = 3

[profile.bench]
lto = true
opt-level = 3

[profile.release]
lto = true
panic = "abort"
opt-level = 3
